<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Retro Neon Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #060913;
    --panel: #0d1424;
    --border: #1c2b45;
    --cyan: #00f0ff;
    --green: #39ff14;
    --pink: #ff2e88;
    --yellow: #ffe600;
    --text: #d7e9ff;
    --muted: #647d99;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    background:
      radial-gradient(1100px 700px at 50% -10%, #101c38 0%, transparent 60%),
      radial-gradient(900px 600px at 85% 110%, rgba(255, 46, 136, .07) 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  header { text-align: center; }
  h1 {
    font-size: clamp(26px, 5vw, 40px);
    letter-spacing: .4em;
    text-indent: .4em;
    color: #eafff0;
    text-shadow:
      0 0 8px rgba(57, 255, 20, .9),
      0 0 26px rgba(57, 255, 20, .5),
      0 0 70px rgba(0, 240, 255, .35);
  }
  .tagline {
    margin-top: 5px;
    font-size: 11px;
    letter-spacing: .5em;
    text-indent: .5em;
    color: var(--muted);
  }

  .scoreboard { display: flex; gap: 14px; }
  .score-box {
    min-width: 140px;
    padding: 10px 22px 12px;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: inset 0 0 18px rgba(0, 240, 255, .05);
  }
  .score-box .label {
    font-size: 11px;
    letter-spacing: .28em;
    text-indent: .28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .score-box .value { margin-top: 3px; font-size: 28px; font-weight: 700; }
  #score { color: var(--cyan); text-shadow: 0 0 12px rgba(0, 240, 255, .6); }
  #highScore { color: var(--yellow); text-shadow: 0 0 12px rgba(255, 230, 0, .45); }
  .value.bump { animation: bump .25s ease; }
  @keyframes bump { 40% { transform: scale(1.3); } }

  .stage {
    position: relative;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow:
      0 0 40px rgba(0, 240, 255, .08),
      0 0 90px rgba(57, 255, 20, .05);
    animation: stagePulse 4s ease-in-out infinite;
  }
  @keyframes stagePulse {
    0%, 100% { box-shadow: 0 0 32px rgba(0, 240, 255, .06), 0 0 70px rgba(57, 255, 20, .04); }
    50%      { box-shadow: 0 0 58px rgba(0, 240, 255, .16), 0 0 120px rgba(57, 255, 20, .09); }
  }
  canvas {
    display: block;
    width: min(480px, calc(100vw - 64px));
    height: auto;
    border-radius: 6px;
    background: #070b12;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 6px;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, .025) 0 1px,
      transparent 1px 3px
    );
  }

  .overlay {
    position: absolute;
    inset: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    background: rgba(5, 9, 18, .84);
    backdrop-filter: blur(3px);
    border-radius: 6px;
  }
  .overlay.hidden { display: none; }
  #overlayTitle {
    font-size: 30px;
    letter-spacing: .22em;
    text-indent: .22em;
    color: var(--green);
    text-shadow: 0 0 14px rgba(57, 255, 20, .7);
  }
  .overlay[data-state="paused"] #overlayTitle {
    color: var(--yellow);
    text-shadow: 0 0 14px rgba(255, 230, 0, .6);
  }
  .overlay[data-state="over"] #overlayTitle {
    color: var(--pink);
    text-shadow: 0 0 16px rgba(255, 46, 136, .75);
  }
  #overlayText { max-width: 300px; font-size: 13px; line-height: 1.7; color: var(--text); }

  .controls { display: flex; gap: 12px; }
  .btn {
    padding: 10px 20px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--cyan);
    background: rgba(0, 240, 255, .06);
    border: 1px solid var(--cyan);
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) {
    background: rgba(0, 240, 255, .16);
    box-shadow: 0 0 16px rgba(0, 240, 255, .45);
  }
  .btn:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .btn.green { color: var(--green); border-color: var(--green); background: rgba(57, 255, 20, .06); }
  .btn.green:hover:not(:disabled) {
    background: rgba(57, 255, 20, .16);
    box-shadow: 0 0 16px rgba(57, 255, 20, .45);
  }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.muted { color: var(--muted); border-color: var(--muted); background: transparent; }

  .hint { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  kbd {
    padding: 1px 6px;
    font-size: 11px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <h1>SNAKE</h1>
      <div class="tagline">RETRO &middot; ARCADE &middot; NEON</div>
    </header>

    <div class="scoreboard" role="status" aria-label="Punteggio">
      <div class="score-box">
        <div class="label">Punteggio</div>
        <div class="value" id="score" aria-live="polite">0</div>
      </div>
      <div class="score-box">
        <div class="label">Record</div>
        <div class="value" id="highScore" aria-live="polite">0</div>
      </div>
    </div>

    <div class="stage">
      <canvas id="game" width="480" height="480" role="img" aria-label="Campo di gioco Snake"></canvas>
      <div class="overlay" id="overlay" data-state="ready" role="dialog" aria-modal="true" aria-label="Stato del gioco">
        <h2 id="overlayTitle">SNAKE</h2>
        <p id="overlayText">Frecce o WASD per muoverti.<br>Spazio per la pausa, R per ricominciare.</p>
        <button class="btn green" id="overlayBtn" aria-label="Gioca">Gioca</button>
      </div>
    </div>

    <div class="controls" role="toolbar" aria-label="Controlli gioco">
      <button class="btn" id="pauseBtn" disabled aria-label="Pausa">Pausa (Spazio)</button>
      <button class="btn green" id="restartBtn" aria-label="Ricomincia">Ricomincia (R)</button>
      <button class="btn" id="soundBtn" title="Attiva/disattiva effetti sonori (M)" aria-label="Attiva/disattiva suono">🔊 Suono</button>
    </div>

    <p class="hint" aria-label="Scorciatoie tastiera">
      <kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
      muovi &middot; <kbd>Spazio</kbd> pausa &middot; <kbd>R</kbd> ricomincia &middot; <kbd>M</kbd> audio
    </p>
  </div>

<script>
(() => {
  'use strict';

  // === Configuration ===
  const COLS = 20;
  const ROWS = 20;
  const CELL = 24;
  const BASE_SPEED = 140;
  const MIN_SPEED = 70;
  const SPEED_STEP = 3;
  const POINTS = 10;
  const MAX_PARTICLES = 220;
  const TRAIL_MAX = 8;
  const HS_KEY = 'snakeNeonHighScore';
  const MUTE_KEY = 'snakeNeonMuted';

  // === DOM ===
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const overlayEl = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const soundBtn = document.getElementById('soundBtn');

  // === DPI-aware canvas setup ===
  const LOGICAL_W = COLS * CELL;
  const LOGICAL_H = ROWS * CELL;
  const MAX_DPR = 2;
  let dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);

  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    canvas.width = LOGICAL_W * dpr;
    canvas.height = LOGICAL_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuildVignette();
  }

  // === State ===
  const STATE = { READY: 0, RUNNING: 1, PAUSED: 2, OVER: 3 };
  let state = STATE.READY;
  let snake = [];
  let dir = { x: 1, y: 0 };
  let dirQueue = [];
  let food = null;
  let score = 0;
  let speed = BASE_SPEED;
  let stepAcc = 0;
  let lastTime = 0;

  // Effects
  let particles = [];
  let floaters = [];
  let trail = [];
  let shake = 0;
  let shakeDecay = 0;
  let flash = null;
  let ctime = 0;
  let lastFrameTime = 0;

  const stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * LOGICAL_W,
    y: Math.random() * LOGICAL_H,
    r: Math.random() * 1.1 + .2,
    ph: Math.random() * Math.PI * 2,
    sp: .5 + Math.random() * 1.5
  }));

  let vignette = null;
  function rebuildVignette() {
    const cx = LOGICAL_W / 2, cy = LOGICAL_H / 2;
    vignette = ctx.createRadialGradient(cx, cy, 130, cx, cy, 350);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,.55)');
  }

  // === High Score ===
  function loadHighScore() {
    try { return Number(localStorage.getItem(HS_KEY)) || 0; } catch { return 0; }
  }
  function saveHighScore(v) {
    try { localStorage.setItem(HS_KEY, String(v)); } catch {}
  }
  let highScore = loadHighScore();

  // === Audio ===
  let actx = null;
  let master = null;
  let muted = loadMuted();

  function loadMuted() {
    try { return localStorage.getItem(MUTE_KEY) === '1'; } catch { return false; }
  }
  function saveMuted(v) {
    try { localStorage.setItem(MUTE_KEY, v ? '1' : '0'); } catch {}
  }

  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.16;
      const lp = actx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2200;
      master.connect(lp);
      lp.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  }

  function beep(freq, dur, { type = 'square', vol = 1, slideTo = null, delay = 0 } = {}) {
    if (!actx || muted) return;
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  const SFX = {
    start()  { [523, 659, 784].forEach((f, i) => beep(f, .09, { delay: i * .07 })); },
    eat()    { beep(660, .06); beep(990, .09, { delay: .06 }); },
    turn()   { beep(440, .03, { vol: .25 }); },
    pause()  { beep(880, .08); beep(440, .11, { delay: .09 }); },
    resume() { beep(440, .08); beep(880, .11, { delay: .09 }); },
    over() {
      beep(300, .45, { type: 'sawtooth', slideTo: 55, vol: .7 });
      beep(150, .6, { slideTo: 45, vol: .5, delay: .08 });
    },
    record() { [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, .13, { delay: i * .09 })); },
    win()    { [392, 523, 659, 784, 1047, 1319, 1568].forEach((f, i) => beep(f, .16, { delay: i * .1 })); },
  };

  function toggleMute() {
    initAudio();
    muted = !muted;
    saveMuted(muted);
    soundBtn.textContent = muted ? '🔇 Suono' : '🔊 Suono';
    soundBtn.classList.toggle('muted', muted);
    if (!muted) beep(660, .08);
  }

  // === Game Logic ===
  function resetGame() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    dirQueue.length = 0;
    score = 0;
    speed = BASE_SPEED;
    stepAcc = 0;
    lastTime = 0;
    particles.length = 0;
    floaters.length = 0;
    trail.length = 0;
    shake = 0;
    shakeDecay = 0;
    flash = null;
    food = null;
    scoreEl.textContent = '0';
    spawnFood();
  }

  function startGame() {
    initAudio();
    resetGame();
    state = STATE.RUNNING;
    hideOverlay();
    pauseBtn.disabled = false;
    pauseBtn.textContent = 'Pausa (Spazio)';
    SFX.start();
  }

  function togglePause() {
    if (state === STATE.RUNNING) {
      state = STATE.PAUSED;
      stepAcc = 0;
      showOverlay('paused', 'PAUSA', 'Il gioco è in pausa.\nPremi Spazio per continuare.', 'Riprendi');
      pauseBtn.textContent = 'Riprendi (Spazio)';
      SFX.pause();
    } else if (state === STATE.PAUSED) {
      state = STATE.RUNNING;
      lastTime = 0;
      stepAcc = 0;
      hideOverlay();
      pauseBtn.textContent = 'Pausa (Spazio)';
      SFX.resume();
    }
  }

  function gameOver(win = false) {
    state = STATE.OVER;
    stepAcc = 0;

    const hx = snake[0].x * CELL + CELL / 2;
    const hy = snake[0].y * CELL + CELL / 2;
    spawnBurst(hx, hy, 48, win
      ? ['#ffe600', '#ffffff', '#39ff14']
      : ['#ff2e88', '#ff8ab5', '#00f0ff', '#ffffff'], 1.5);
    shake = 20;
    shakeDecay = 3.0;
    flash = { a: .4, c: win ? 'rgba(255,230,0,' : 'rgba(255,46,136,' };

    const newRecord = !win && score > loadHighScore();
    if (score > highScore) {
      highScore = score;
      saveHighScore(highScore);
      highScoreEl.textContent = highScore;
    }
    showOverlay(
      'over',
      win ? 'HAI VINTO!' : 'GAME OVER',
      `Punteggio: ${score}` + (newRecord ? ' — Nuovo record! 🏆' : ''),
      'Rigioca'
    );
    pauseBtn.disabled = true;
    if (win) SFX.win();
    else { SFX.over(); if (newRecord) setTimeout(() => SFX.record(), 750); }
  }

  function tick() {
    while (dirQueue.length) {
      const nd = dirQueue.shift();
      if (nd.x === -dir.x && nd.y === -dir.y) continue;
      dir = nd;
      break;
    }

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();

    const willGrow = food && head.x === food.x && head.y === food.y;
    const bodyLen = willGrow ? snake.length : snake.length - 1;
    for (let i = 0; i < bodyLen; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    const prevHead = snake[0];
    snake.unshift(head);

    trail.push({ x: prevHead.x, y: prevHead.y, life: 1 });
    if (trail.length > TRAIL_MAX) trail.shift();

    if (willGrow) {
      score += POINTS;
      scoreEl.textContent = score;
      bump(scoreEl);
      speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
      SFX.eat();

      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      spawnBurst(fx, fy, 18, ['#39ff14', '#00f0ff', '#fff59b'], 1);
      floaters.push({ x: fx, y: fy, text: '+' + POINTS, color: '#ffe600', life: 1 });
      shake = Math.max(shake, 4);
      shakeDecay = Math.max(shakeDecay, 4.0);
      flash = { a: .18, c: 'rgba(57,255,20,' };

      spawnFood();
    } else {
      snake.pop();
    }
  }

  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    if (!free.length) { gameOver(true); return; }
    food = free[(Math.random() * free.length) | 0];
  }

  // === Drawing ===
  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(0, 240, 255, .055)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const p = i * CELL + .5;
      ctx.moveTo(p, 0); ctx.lineTo(p, LOGICAL_H);
    }
    for (let j = 1; j < ROWS; j++) {
      const p = j * CELL + .5;
      ctx.moveTo(0, p); ctx.lineTo(LOGICAL_W, p);
    }
    ctx.stroke();
  }

  function drawFood() {
    if (!food) return;
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const pulse = Math.sin(ctime * .18) * 1.3;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ctime * .05);
    ctx.strokeStyle = 'rgba(255, 46, 136, .75)';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = '#ff2e88';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a0 = (i / 6) * Math.PI * 2;
      ctx.moveTo(Math.cos(a0) * CELL * .46, Math.sin(a0) * CELL * .46);
      ctx.arc(0, 0, CELL * .46, a0, a0 + Math.PI / 8);
    }
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = '#ff2e88';
    ctx.shadowBlur = 16 + pulse * 3;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, CELL * .42);
    g.addColorStop(0, '#fff1f6');
    g.addColorStop(.35, '#ff5ca8');
    g.addColorStop(1, '#ff2e88');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * .3 + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255, 255, 255, .9)';
    ctx.beginPath();
    ctx.arc(cx - 3.2, cy - 3.2, 2.2, 0, Math.PI * 2);
    ctx.fill();

    if (Math.random() < .05) spawnBurst(cx, cy, 1, ['#ff8ab5'], .6);
  }

  function drawSnake() {
    const n = snake.length;
    if (!n) return;

    const headC = snake[0], tailC = snake[n - 1];
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = CELL - 5;
    const grad = ctx.createLinearGradient(
      headC.x * CELL, headC.y * CELL,
      tailC.x * CELL, tailC.y * CELL
    );
    grad.addColorStop(0, '#d6ff6e');
    grad.addColorStop(.35, '#39ff14');
    grad.addColorStop(1, '#00d0ff');
    ctx.shadowColor = 'rgba(57, 255, 20, .8)';
    ctx.shadowBlur = 14;
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(headC.x * CELL + CELL / 2, headC.y * CELL + CELL / 2);
    for (let i = 1; i < n; i++) {
      ctx.lineTo(snake[i].x * CELL + CELL / 2, snake[i].y * CELL + CELL / 2);
    }
    ctx.stroke();
    ctx.restore();

    const x = headC.x * CELL, y = headC.y * CELL;
    ctx.save();
    ctx.shadowColor = '#9dff2e';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#d6ff6e';
    roundRectPath(x + 1.5, y + 1.5, CELL - 3, CELL - 3, 8);
    ctx.fill();
    ctx.restore();

    const cx = x + CELL / 2, cy = y + CELL / 2;
    const px = -dir.y, py = dir.x;
    for (const side of [1, -1]) {
      const ex = cx + dir.x * 4.5 + px * 4.5 * side;
      const ey = cy + dir.y * 4.5 + py * 4.5 * side;
      ctx.fillStyle = '#06290f';
      ctx.beginPath();
      ctx.arc(ex, ey, 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#eaffff';
      ctx.beginPath();
      ctx.arc(ex - .8, ey - .8, .9, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw() {
    ctime++;
    ctx.save();
    if (shake > .2) {
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    } else {
      shake = 0;
      shakeDecay = 0;
    }

    ctx.fillStyle = '#070b12';
    ctx.fillRect(-12, -12, LOGICAL_W + 24, LOGICAL_H + 24);
    drawStars();
    drawGrid();
    drawTrail();
    drawFood();
    drawSnake();

    ctx.restore();

    drawParticles();
    drawFloaters();

    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (flash && flash.a > 0) {
      ctx.fillStyle = flash.c + flash.a + ')';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    }
  }

  // === Particles ===
  function spawnBurst(x, y, count, colors, power = 1) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (Math.random() * 2.6 + .6) * power;
      particles.push({
        x, y,
        vx: Math.cos(a) * s * 2.2,
        vy: Math.sin(a) * s * 2.2 - .6,
        life: 1,
        dec: .6 + Math.random() * .9,
        size: 1 + Math.random() * 2.6,
        color: colors[(Math.random() * colors.length) | 0],
        grav: .06
      });
    }
    if (particles.length > MAX_PARTICLES) {
      particles.splice(0, particles.length - MAX_PARTICLES);
    }
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += p.grav;
      p.vx *= .94; p.vy *= .94;
      p.life -= p.dec * .02;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life) * .9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life + .4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawFloaters() {
    if (!floaters.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '700 16px ui-monospace, Consolas, monospace';
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= .9;
      f.life -= .022;
      if (f.life <= 0) { floaters.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawTrail() {
    if (!trail.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = trail.length - 1; i >= 0; i--) {
      const t = trail[i];
      t.life -= .06;
      if (t.life <= 0) { trail.splice(i, 1); continue; }
      ctx.globalAlpha = t.life * .28;
      ctx.fillStyle = '#39ff14';
      ctx.beginPath();
      ctx.arc(t.x * CELL + CELL / 2, t.y * CELL + CELL / 2, CELL * .55 * t.life + 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawStars() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const a = .25 + .45 * Math.abs(Math.sin(ctime * .03 * s.sp + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#9fd8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // === Main Loop ===
  function loop(t) {
    requestAnimationFrame(loop);

    const rawDt = lastFrameTime ? t - lastFrameTime : 16;
    lastFrameTime = t;
    const dt = Math.min(rawDt, 100);

    if (state === STATE.RUNNING) {
      if (lastTime === 0) lastTime = t;
      stepAcc += t - lastTime;
      lastTime = t;
      while (stepAcc >= speed) {
        stepAcc -= speed;
        tick();
        if (state !== STATE.RUNNING) break;
      }
    } else {
      lastTime = 0;
      stepAcc = 0;
    }

    if (shake > .2) {
      shake *= Math.exp(-shakeDecay * dt / 1000);
    }
    if (flash && flash.a > 0) {
      flash.a *= Math.pow(.9, dt / 16.67);
    }

    draw();
  }

  // === Overlay ===
  function showOverlay(stateName, title, text, btnLabel) {
    overlayEl.dataset.state = stateName;
    overlayTitle.textContent = title;
    overlayText.innerHTML = text.replace(/\n/g, '<br>');
    overlayBtn.textContent = btnLabel;
    overlayEl.classList.remove('hidden');
  }
  function hideOverlay() {
    overlayEl.classList.add('hidden');
  }

  function bump(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  // === Input ===
  const KEY_DIRS = {
    ArrowUp:    { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown:  { x: 0, y: 1 },  KeyS: { x: 0, y: 1 },
    ArrowLeft:  { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },  KeyD: { x: 1, y: 0 },
  };

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    initAudio();

    const d = KEY_DIRS[e.code];
    if (d) {
      e.preventDefault();
      if (state === STATE.READY) { startGame(); return; }
      if (state === STATE.RUNNING && dirQueue.length < 3) {
        const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
        if (!(d.x === -last.x && d.y === -last.y) && !(d.x === last.x && d.y === last.y)) {
          dirQueue.push(d);
          SFX.turn();
        }
      }
      return;
    }

    switch (e.code) {
      case 'Space':
        e.preventDefault();
        if (state === STATE.READY || state === STATE.OVER) startGame();
        else togglePause();
        break;
      case 'KeyR':
        e.preventDefault();
        startGame();
        break;
      case 'KeyM':
        e.preventDefault();
        toggleMute();
        break;
      case 'Enter':
        if (state === STATE.READY || state === STATE.OVER) startGame();
        break;
    }
  });

  overlayBtn.addEventListener('click', () => {
    overlayBtn.blur();
    if (state === STATE.PAUSED) togglePause();
    else startGame();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    togglePause();
  });

  restartBtn.addEventListener('click', () => {
    restartBtn.blur();
    startGame();
  });

  soundBtn.addEventListener('click', () => {
    soundBtn.blur();
    toggleMute();
  });

  window.addEventListener('blur', () => {
    if (state === STATE.RUNNING) togglePause();
  });

  window.addEventListener('focus', () => {
    if (actx && actx.state === 'suspended') actx.resume();
  });

  // === Init ===
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  highScoreEl.textContent = highScore;
  soundBtn.textContent = muted ? '🔇 Suono' : '🔊 Suono';
  soundBtn.classList.toggle('muted', muted);
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
