<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} · StreamNova</title>
  <style>
    :root { --text: #1c2330; --muted: #5a6475; --accent: #2563eb; --border: #dde3ec; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: #f7f9fc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }
    header.site {
      background: #101828;
      color: #fff;
      padding: 18px 20px;
    }
    header.site .brand {
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      text-decoration: none;
    }
    header.site .tag { display: block; font-size: 0.85rem; opacity: 0.75; margin-top: 2px; }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 48px;
      background: #fff;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-height: calc(100vh - 140px);
    }
    h1 { font-size: 1.6rem; line-height: 1.3; margin-top: 0; }
    h2 { font-size: 1.2rem; margin-top: 1.8em; }
    h3 { font-size: 1.02rem; }
    a { color: var(--accent); }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 0.92rem; }
    footer.site {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 20px 28px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer.site a { margin-right: 14px; }
    @media (max-width: 600px) {
      main { border-left: none; border-right: none; padding: 20px 16px 36px; }
    }
  </style>
</head>
<body>
  <header class="site">
    <a class="brand" href="/StreamNova/">StreamNova</a>
    <span class="tag">Media center per Android TV e Fire TV</span>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    <a href="/StreamNova/privacy/">Privacy Policy</a>
    <a href="/StreamNova/terms/">Termini di Servizio</a>
    <a href="https://github.com/miciotto-web/StreamNova">Repository GitHub</a>
  </footer>
</body>
</html>
